name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Fails if themes.css has drifted from src/themes/*.ts, or if any theme
      # breaks the contrast rules in scripts/contrast.ts.
      - run: npm run check
